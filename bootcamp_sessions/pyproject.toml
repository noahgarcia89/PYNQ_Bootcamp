[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bootcamp_utils"
version = "1.0.0"
description = "Shared helper library for the PYNQ AI Bootcamp notebooks"
requires-python = ">=3.6"

# Note: runtime dependencies (pynq_dpu, pynq_peripherals, numpy, opencv, etc.)
# are already provided by the PYNQ board image, so they are intentionally not
# listed here to avoid pip trying to reinstall board-specific packages.

[tool.setuptools]
# The package folder `bootcamp_utils` lives right next to this file.
packages = ["bootcamp_utils"]
